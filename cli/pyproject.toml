[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelbygget"
version = "0.1.0"
description = "Claim a Pixelbygget cell, render it, redraw it, and upload the PNG."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
render = ["pillow", "numpy"]

[project.scripts]
rutor = "rutor.__main__:main"

[tool.setuptools.packages.find]
include = ["rutor*"]
